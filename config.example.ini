; --- Médiatár erőforrás-típusok (opcionális, deploymentenként eltérhet) ---
;
; A gyökér a path.ckfinder (illetve a path.mediatar, ha meg van adva). A típusok
; ehhez képest relatív alkönyvtárban élnek; az üres dir maga a gyökér.
;
; Ha ezekből egy sort sem írsz ki, a Services\MediatarService::DEFAULTTYPES lép
; életbe – tehát nem kötelező hozzányúlni. Ami ki van írva, az felülírja az
; alapértelmezést, MEZŐNKÉNT: elég az ext sort megadni, ha csak azt bővíted.
;
; max: érti az 50M rövidítést; 0 = nincs típus-plafon, a PHP upload_max_filesize
; és post_max_size dönt (a választó láblécében ki is írjuk az effektív értéket).
;
; FIGYELEM: az swf feltöltése tárolt XSS-vektor – a Flash Player 2021 óta halott,
; a fájl viszont ettől még kiszolgálódik. Csak akkor vedd fel, ha tényleg kell.
;
;mediatar.type.Images.dir =
;mediatar.type.Images.ext = bmp,gif,jpeg,jpg,png,doc,docx,xls,xlsx,ppt,pptx,pdf,csv,txt,rtf,ods,odt,zip
;mediatar.type.Images.max = 0
;
;mediatar.type.Videos.dir = videos
;mediatar.type.Videos.ext = mp4,webm
;mediatar.type.Videos.max = 50M
;
;mediatar.type.Files.dir = files
;mediatar.type.Files.ext = 7z,aiff,asf,bmp,csv,doc,docx,gz,gzip,jpeg,jpg,mid,ods,odt,pdf,png,ppt,pptx,pxd,qt,ram,rar,rm,rmi,rmvb,rtf,sdc,sitd,sxc,sxw,tar,tgz,tif,tiff,txt,vsd,xls,xlsx,zip
;mediatar.type.Files.max = 0

