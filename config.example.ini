; --- Cron (lásd docs/cron.md) ---
;
; A takarító feladat (php cron.php cleanup) korlátai. Ha nincsenek kiírva, a
; Services\Cron\CleanupTask alapértelmezései lépnek életbe.
;
;cron.logmaxsize   = 10M   ; ennél nagyobb .txt/.log naplót forgat (0 = nincs forgatás)
;cron.logretention = 30    ; ennyi napnál régebbi cronlog sor törlődik (0 = nincs törlés)
